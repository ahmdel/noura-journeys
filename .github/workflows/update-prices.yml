name: Update tour prices

on:
  schedule:
    - cron: "30 4,12,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recalculate dynamic prices
        run: python scripts/update_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "noura-price-bot"
          git config user.email "noura-price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update dynamic tour prices"
          git push
      - name: Deploy Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN missing; skip hosting deploy"
            exit 0
          fi
          npx --yes firebase-tools deploy --only hosting:noura-journeys --non-interactive --project mobileappdate-edf6a --token "$FIREBASE_TOKEN"
